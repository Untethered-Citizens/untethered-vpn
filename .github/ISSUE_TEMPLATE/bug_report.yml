name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please don't include keys, passwords, WireGuard configurations, server addresses or personal data you'd rather keep private.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "In the app, Settings → About, or the commit if you built it yourself."
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: "Apple TV 4K (1st generation), tvOS 26.6"
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Crop out anything private.
